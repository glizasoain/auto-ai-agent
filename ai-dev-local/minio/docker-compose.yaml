version: "3.8"

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-11-13T20-04-41Z
    container_name: ai-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aideradmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aidersecret}
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data:/data

