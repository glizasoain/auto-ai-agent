[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circle-demo"
version = "0.1.0"
description = "Demo project that renders a simple filled circle via CLI and Flask."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "matplotlib>=3.8"
]

[project.scripts]
circle-demo = "circle_demo.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
